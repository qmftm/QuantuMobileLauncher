name: iOS build

# Builds QuantuMobile for iPhone: Amethyst-iOS (GPL-3.0) at the commit pinned in ios/amethyst/UPSTREAM, with our branding
# applied by ios/amethyst/apply.sh. Produces an unsigned .ipa for SideStore/AltStore (JIT via StikDebug) and a .tipa for TrollStore.
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Amethyst-iOS at the pinned commit
        run: |
          url=$(sed -n 1p ios/amethyst/UPSTREAM); sha=$(sed -n 2p ios/amethyst/UPSTREAM)
          git init -q upstream && cd upstream
          git remote add origin "$url"
          git fetch -q --depth 1 origin "$sha" && git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Install build tools
        run: brew install ldid make

      - name: Apply QuantuMobile branding
        run: ios/amethyst/apply.sh upstream

      - name: Build (.ipa for SideStore/AltStore)
        working-directory: upstream
        run: gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin"

      - name: Keep the .ipa
        run: |
          mkdir -p out
          mv upstream/artifacts/org.angelauramc.amethyst-*-ios.ipa out/QuantuMobile-ios.ipa

      - name: Build (.tipa for TrollStore)
        working-directory: upstream
        run: gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin" TROLLSTORE_JIT_ENT=1

      - name: Keep the .tipa
        run: mv upstream/artifacts/org.angelauramc.amethyst-*-ios-trollstore.tipa out/QuantuMobile-ios-trollstore.tipa

      - uses: actions/upload-artifact@v4
        with:
          name: QuantuMobile-ios
          path: out/
