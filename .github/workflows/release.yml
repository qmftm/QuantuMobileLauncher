name: Release

# Runs for pushed "v*" tags, or for any branch push whose commit message contains "[release]"
# (the tag is then created from versionName in app/build.gradle.kts).
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Test
        run: ./gradlew testDebugUnitTest
      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug
      - name: Rename APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/QuantuMobileLauncher-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/QuantuMobileLauncher-${{ steps.version.outputs.tag }}-debug.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: QuantuMobileLauncher ${{ steps.version.outputs.tag }}
          prerelease: false
          make_latest: true
          files: dist/*.apk
          body: |
            안드로이드용 마인크래프트 자바 에디션 런처입니다.

            **포함된 기능**
            - 마이크로소프트 / 오프라인 계정
            - 바닐라·스냅샷 버전, Fabric 원클릭 설치, 인스턴스
            - 클라이언트·라이브러리·에셋 다운로드 (SHA-1 검증)
            - Java 런타임(.tar.xz) 가져오기, 버전별 Java 자동 선택
            - 터치 컨트롤, 키보드·마우스 지원, 한국어/영어 UI
            - **새 앱 아이콘**, 다크 테마, 그라데이션 플레이 버튼, 설정 아이콘
            - **Modrinth 연동**: 모드·리소스팩·셰이더 검색/설치/삭제/업데이트 (필수 의존성 자동 설치, SHA-1 검증)
            - **Java 런타임 다운로드**: 목록에서 고르거나 링크 입력, 필요한 Java가 없을 때 바로 받기
            - **백그라운드 동작**: 설치·다운로드가 앱을 나가도 계속(진행 알림), 완료 알림, 게임은 홈으로 나가도 계속 실행(알림에서 복귀/종료)
            - **자동 다운로드**: 앱을 켜면 LWJGL(안드로이드용)과 기본 Java를 미리 받고, 플레이를 누르면 필요한 Java(17/21/25)·게임 파일을 알아서 받음 (모두 SHA-256 검증)
            - **게임 화면 브릿지**: PojavLauncher 의 네이티브 브릿지(`libpojavexec`)를 이식해 화면 출력·터치/키 입력을 연결
            - **비주얼 탭**: 리소스팩·셰이더 추가(기기/Modrinth), 켜기/끄기·우선순위, 셰이더 선택
            - 홈에서 계정·인스턴스 바로 전환, 처음 실행 체크리스트, 검색·필터 버전 선택, 인스턴스 메뉴, 로그 색상 강조

            **주의**
            - **게임 화면 브릿지는 실기기에서 검증되지 않았습니다.** 안 뜨면 홈 → 게임 로그를 공유해 주세요. 렌더러는 GL4ES 만 지원합니다.
            - 계정 탭은 상단 바의 사람 아이콘으로 옮겼습니다.
            - Java 8(1.16.5 이하용)은 아직 지원하지 않습니다.
            - 아직 실기기 테스트 전입니다.
            - APK는 임시 디버그 키로 서명되어 있어, 이전 버전 위에 덮어 설치가 안 되면 삭제 후 재설치가 필요합니다.
