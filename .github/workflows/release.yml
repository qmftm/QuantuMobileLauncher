name: Release

# Runs for pushed "v*" tags, or for any branch push whose commit message contains "[release]"
# (the tag is then created from versionName in app/build.gradle.kts).
# "[snapshot]" instead publishes a test build: tag v<versionName>-snapshot.<run number>, marked pre-release (not
# "latest"), APK + AFK host only (the slow iPhone build runs for real releases).
on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[snapshot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          else
            VER="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
            if [[ "$COMMIT_MESSAGE" == *"[snapshot]"* && "$COMMIT_MESSAGE" != *"[release]"* ]]; then
              # A test build: v1.5.1-snapshot.<run number>, marked pre-release and never "latest".
              echo "tag=v${VER}-snapshot.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "snapshot=true" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
              echo "snapshot=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.QML_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.QML_KEYSTORE_PASSWORD }}
        run: |
          # Optional override: a key from repository secrets. Without it the build uses the project key in app/signing.
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "QML_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "QML_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "QML_KEY_PASSWORD=$KEYSTORE_PASSWORD"
              echo "QML_KEY_ALIAS=quantumobile"
            } >> "$GITHUB_ENV"
          else
            echo "No signing secrets set: using the project key committed in app/signing."
          fi
      - name: Test
        run: ./gradlew testDebugUnitTest :afk-core:test :afk-host:test
      - name: Build APKs
        run: ./gradlew assembleRelease :afk-host:jar
      - name: Rename APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/QuantuMobileLauncher-${{ steps.version.outputs.tag }}.apk"
          cp afk-host/build/libs/afk-host.jar "dist/QuantuMobileLauncher-AFK-Host.jar"
      - name: Write release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SNAPSHOT: ${{ steps.version.outputs.snapshot }}
        run: |
          BASE="${TAG%%-snapshot*}"
          {
            if [ "$SNAPSHOT" = "true" ]; then
              echo "> ⚠️ **스냅샷(테스트) 빌드**입니다. 아직 정식 버전이 아니며 불안정할 수 있어요. 문제가 있으면 정식 릴리스(최신 버전)를 쓰세요."
              echo
            fi
            echo "## 이번 버전 ($TAG) 변경사항"
            echo
            if [ -f "release-notes/$BASE.md" ]; then
              cat "release-notes/$BASE.md"
            else
              # No notes file: use the body of the release commit message (everything after the first line).
              printf '%s\n' "$COMMIT_MESSAGE" | tail -n +3
            fi
            echo
            echo "---"
            echo
            if [ "$SNAPSHOT" = "true" ]; then
              # Snapshots carry no iPhone build: leave out the line about it.
              grep -v 'QuantuMobile-iOS' .github/release-common.md
            else
              cat .github/release-common.md
            fi
          } > release-body.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: QuantuMobileLauncher ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.snapshot == 'true' }}
          make_latest: ${{ steps.version.outputs.snapshot != 'true' }}
          files: |
            dist/*.apk
            dist/*.jar
          body_path: release-body.md

  # Windows AFK host: the jar plus a trimmed Java runtime, packed by jpackage into a folder with
  # QuantuMobile-AFK.exe (console window) and QuantuMobile-AFK-Background.exe (no window, tray icon; what
  # "start with the computer" registers). No Java install needed. Zipped and attached to the same release.
  windows-host:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') || contains(github.event.head_commit.message, '[snapshot]')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          else
            VER="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
            if [[ "$COMMIT_MESSAGE" == *"[snapshot]"* && "$COMMIT_MESSAGE" != *"[release]"* ]]; then
              # A test build: v1.5.1-snapshot.<run number>, marked pre-release and never "latest".
              echo "tag=v${VER}-snapshot.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "snapshot=true" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
              echo "snapshot=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build host jar
        env:
          QML_HOST_ONLY: "1"
        run: ./gradlew :afk-host:jar
      - name: Package Windows app
        run: |
          VERSION="${{ steps.version.outputs.tag }}"; VERSION="${VERSION#v}"; VERSION="${VERSION%%-*}"
          mkdir -p pkg/in && cp afk-host/build/libs/afk-host.jar pkg/in/
          jlink --add-modules java.base,java.desktop,java.instrument,jdk.httpserver,jdk.unsupported,jdk.crypto.ec,jdk.charsets \
            --strip-debug --no-header-files --no-man-pages --output pkg/runtime
          printf '%s\n' 'win-console=false' 'arguments=--background' > pkg/background.properties
          jpackage --type app-image --name QuantuMobile-AFK --input pkg/in --main-jar afk-host.jar \
            --runtime-image pkg/runtime --win-console --app-version "$VERSION" \
            --add-launcher QuantuMobile-AFK-Background=pkg/background.properties \
            --description "QuantuMobile AFK host" --vendor "QuantuMobileLauncher" --dest pkg/out
          printf '%s\r\n' \
            'QuantuMobile AFK 호스트 (윈도우)' '' \
            '1. 이 폴더를 원하는 곳에 둡니다 (압축을 푼 그대로).' \
            '2. QuantuMobile-AFK.exe 를 더블클릭합니다. 자바를 따로 설치할 필요가 없습니다.' \
            '3. 창에 나온 연결 코드를 앱의 AFK 탭 > PC 연결 > PC 추가 에 넣습니다.' \
            '4. 창을 닫으면 PC 쪽 AFK도 꺼집니다. 켜 둔 채로 두세요.' '' \
            '창 없이 돌리기 / 컴퓨터 켤 때 자동 실행:' \
            '- QuantuMobile-AFK-Background.exe 는 창 없이 실행되고, 작업 표시줄 오른쪽 아래(숨겨진 아이콘 ^)에 AFK 아이콘만 뜹니다.' \
            '- AFK 아이콘을 우클릭 > "컴퓨터 켤 때 자동 실행" 을 체크하면 다음부터 로그인할 때 창 없이 자동으로 켜집니다.' \
            '- 같은 메뉴에서 연결 코드 보기, 로그 보기, 종료를 할 수 있습니다. 폴더를 옮기면 프로그램을 한 번 다시 실행해 주세요.' '' \
            '방화벽 허용 창이 뜨면 허용을 눌러 주세요 (같은 와이파이에서 연결할 때 필요).' \
            > "pkg/out/QuantuMobile-AFK/README.txt"
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path pkg/out/QuantuMobile-AFK -DestinationPath QuantuMobileLauncher-AFK-Host-Windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: QuantuMobileLauncher-AFK-Host-Windows.zip

  # iPhone app (Amethyst-iOS with QuantuMobile branding and 26.x support), attached to the same release.
  ios:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          else
            VER="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
            if [[ "$COMMIT_MESSAGE" == *"[snapshot]"* && "$COMMIT_MESSAGE" != *"[release]"* ]]; then
              # A test build: v1.5.1-snapshot.<run number>, marked pre-release and never "latest".
              echo "tag=v${VER}-snapshot.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
              echo "snapshot=true" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
              echo "snapshot=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Fetch Amethyst-iOS at the pinned commit
        run: |
          url=$(sed -n 1p ios/amethyst/UPSTREAM); sha=$(sed -n 2p ios/amethyst/UPSTREAM)
          git init -q upstream && cd upstream
          git remote add origin "$url"
          git fetch -q --depth 1 origin "$sha" && git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"
      - name: Install build tools
        run: brew install ldid make autoconf automake libtool
      - name: Apply QuantuMobile changes
        run: ios/amethyst/apply.sh upstream
      - name: Build the 26.x natives
        run: ios/natives/build-ios-natives.sh upstream/Natives/resources/lwjgl34
      - name: Build .ipa and .tipa
        run: |
          mkdir -p out
          (cd upstream && gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin")
          mv upstream/artifacts/org.angelauramc.amethyst-*-ios.ipa "out/QuantuMobile-iOS-${{ steps.version.outputs.tag }}.ipa"
          (cd upstream && gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin" TROLLSTORE_JIT_ENT=1)
          mv upstream/artifacts/org.angelauramc.amethyst-*-ios-trollstore.tipa "out/QuantuMobile-iOS-${{ steps.version.outputs.tag }}-TrollStore.tipa"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: out/*
