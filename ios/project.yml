name: QuantuMobile
options:
  bundleIdPrefix: com.quantumobile
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  QuantuMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources/QuantuMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quantumobile.launcher.ios
        PRODUCT_NAME: QuantuMobile
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: QuantuMobile
